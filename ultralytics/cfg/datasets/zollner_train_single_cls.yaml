# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
path: /  # dataset root dir
train: 
  - data22/datasets/zollner_dataset/paper_data/train/images
  - data22/mal/coco/coco/images/train2017_binary/
  # - mal/open_sensor_rail_data/in_yolo_format/train_tracks_bg/images/
val:
  - data22/datasets/zollner_dataset/paper_data/val/images
  - data22/mal/coco/coco/images/val2017_binary/
test: 
  - data22/datasets/zollner_dataset/paper_data/test/images
# Classes
names:
  0: train

